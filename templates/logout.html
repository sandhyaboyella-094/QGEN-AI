<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out | QGEN-AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --maroon: #82193A;
            --dark-maroon: #5c1229;
            --cream: #FEE3C5;
            --gold: #e7ad55;
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 20% 25%, rgba(130,25,58,.38), transparent 42%),
                radial-gradient(circle at 80% 70%, rgba(156,34,72,.28), transparent 42%),
                linear-gradient(160deg, #1a0a10, #12060c 50%, #0d0408);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(3px);
            opacity: .25;
            animation: floatOrb 14s ease-in-out infinite;
        }
        .orb1 {
            width: 300px; height: 300px;
            top: 60px; left: -70px;
            background: radial-gradient(circle at 30% 30%, #82193A, #3d0c1b);
        }
        .orb2 {
            width: 220px; height: 220px;
            right: -50px; bottom: 100px;
            background: radial-gradient(circle at 30% 30%, #9c2248, #5c1229);
            animation-delay: 3s;
        }
        .orb3 {
            width: 140px; height: 140px;
            left: 15%; bottom: 8%;
            background: radial-gradient(circle at 30% 30%, #c9a227, #82193A);
            opacity: .15;
            animation-delay: 1.5s;
        }
        @keyframes floatOrb {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(22px,-35px) scale(1.05); }
            66% { transform: translate(-18px,-15px) scale(0.97); }
        }

        /* 3D Card */
        .box {
            width: 500px;
            max-width: 95%;
            background: linear-gradient(145deg, #FEE3C5 0%, #f8e0c0 100%);
            border-radius: 32px;
            padding: 50px 45px 55px;
            text-align: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.6);
            box-shadow:
                0 40px 90px rgba(0,0,0,.45),
                0 15px 40px rgba(130,25,58,.25),
                inset 0 1px 0 rgba(255,255,255,.7);
            animation: cardIn 1s cubic-bezier(.16,1,.3,1) both;
            transform-style: preserve-3d;
        }

        @keyframes cardIn {
            from { 
                opacity: 0; 
                transform: translateY(50px) rotateX(12deg) scale(.92); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) rotateX(0) scale(1); 
            }
        }

        /* Shine */
        .box::before {
            content: "";
            position: absolute;
            top: 0; left: -120%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
            transform: skewX(-22deg);
            animation: shine 6s 1.2s infinite;
        }
        @keyframes shine {
            0%   { left: -120%; }
            25%  { left: 140%; }
            100% { left: 140%; }
        }

        /* Logo */
        .logo {
            width: 175px;
            height: auto;
            margin: 0 auto 26px;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(130,25,58,.25));
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 3D Logout Icon */
        .logout-icon {
            width: 95px;
            height: 95px;
            margin: 0 auto 26px;
            background: linear-gradient(145deg, #9c2248, #5c1229);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            color: white;
            position: relative;
            z-index: 2;
            box-shadow:
                0 15px 35px rgba(130,25,58,.45),
                inset 0 2px 0 rgba(255,255,255,.2);
            transform: rotateX(8deg) rotateY(-6deg);
            animation: iconPop .9s 0.3s cubic-bezier(.16,1,.3,1) both;
        }
        .logout-icon::after {
            content: "";
            position: absolute;
            inset: 4px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,.15);
            pointer-events: none;
        }
        .logout-icon i {
            line-height: 1;
        }
        @keyframes iconPop {
            from { opacity: 0; transform: scale(0.4) rotateX(30deg); }
            to   { opacity: 1; transform: scale(1) rotateX(8deg) rotateY(-6deg); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            color: var(--maroon);
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        p {
            color: #6b3a3a;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
        }

        /* Creative Timer */
        .timer-wrapper {
            margin: 28px 0 32px;
            position: relative;
            z-index: 2;
        }

        .timer-circle {
            width: 90px;
            height: 90px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: conic-gradient(
                #82193A calc(var(--progress) * 1%),
                rgba(130,25,58,.15) 0
            );
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(130,25,58,.3);
            transition: background 1s linear;
        }

        .timer-circle::before {
            content: "";
            position: absolute;
            inset: 8px;
            background: linear-gradient(145deg, #FEE3C5, #f8e0c0);
            border-radius: 50%;
        }

        .timer-number {
            position: relative;
            z-index: 2;
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--maroon);
            line-height: 1;
        }

        .timer-text {
            font-size: 14px;
            font-weight: 600;
            color: #7a3a3a;
        }

        /* Button */
        a.btn {
            display: inline-block;
            padding: 15px 36px;
            background: linear-gradient(135deg, #82193A, #9c2248);
            color: var(--cream);
            text-decoration: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(130,25,58,.4);
            transition: .35s cubic-bezier(.16,1,.3,1);
            position: relative;
            z-index: 2;
            overflow: hidden;
        }
        a.btn:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 18px 40px rgba(130,25,58,.5);
        }

        @media (max-width: 480px) {
            .box { padding: 40px 24px 48px; }
            .logo { width: 145px; }
            h1 { font-size: 25px; }
            .logout-icon { width: 80px; height: 80px; font-size: 34px; }
            .timer-circle { width: 80px; height: 80px; }
            .timer-number { font-size: 30px; }
        }
    </style>
</head>

<body>

    <!-- Floating Orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="box">

        <!-- Logo -->
        <img src="{{ url_for('static', filename='images/qgen-logo-old.png') }}" 
             alt="QGEN-AI" 
             class="logo">

        <!-- 3D Icon -->
        <div class="logout-icon">
            <i class="fa-solid fa-face-smile"></i>
        </div>

        <h1>You have been logged out</h1>

        <p>
            Thank you for using QGEN-AI.<br>
            See you again soon!
        </p>

        <!-- Creative Circular Timer -->
        <div class="timer-wrapper">
            <div class="timer-circle" id="timerCircle" style="--progress: 100;">
                <div class="timer-number" id="countdown">3</div>
            </div>
            <div class="timer-text">Redirecting to Home...</div>
        </div>

        <a href="{{ url_for('index') }}" class="btn">
            Back to Home Now
        </a>

    </div>

    <script>
        let timeLeft = 3;
        const countdownEl = document.getElementById('countdown');
        const timerCircle = document.getElementById('timerCircle');

        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;

            // Update circular progress (100% → 66% → 33% → 0%)
            const progress = (timeLeft / 3) * 100;
            timerCircle.style.setProperty('--progress', progress);

            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = "0";
                timerCircle.style.setProperty('--progress', 0);
                
                // Small delay for visual finish then redirect
                setTimeout(() => {
                    window.location.href = "{{ url_for('index') }}";
                }, 300);
            }
        }, 1000);
    </script>

</body>
</html>
