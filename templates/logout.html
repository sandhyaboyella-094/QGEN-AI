<style>
/* ===== QGEN-AI royal blue + white theme (shared styles) ===== */
/* =====================================================
   QGEN-AI | Royal Blue + White theme (shared)
   Same design language as admin_dashboard.html
===================================================== */
:root {
    --royal: #1f4fe0; --royal-600: #1a43c4; --royal-700: #1535a0; --royal-800: #0f2878;
    --navy: #07123a; --navy-2: #0a1b5c; --azure: #4c7dff; --sky: #e6eeff; --ice: #eef3ff;
    --white: #ffffff; --text: #0f1b3d; --muted: #5d6b91; --border: #d6e0fb;
    --success: #12a150; --danger: #e5384c;
    --shadow-sm: 0 8px 22px rgba(21,53,160,.10);
    --shadow: 0 20px 48px rgba(21,53,160,.16);
    --shadow-lg: 0 34px 80px rgba(7,18,58,.32);
    --ease: cubic-bezier(.16,1,.3,1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
a { text-decoration: none; color: inherit; }
body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text); min-height: 100vh;
    background:
        radial-gradient(circle at 12% 8%, rgba(76,125,255,.22), transparent 38%),
        radial-gradient(circle at 92% 30%, rgba(31,79,224,.16), transparent 40%),
        linear-gradient(180deg, #e3ebff 0%, #eef3ff 45%, #e6eeff 100%);
    background-attachment: fixed;
}
:focus-visible { outline: 3px solid rgba(76,125,255,.6); outline-offset: 2px; }

/* ---------- KEYFRAMES ---------- */
@keyframes rise { from { opacity: 0; transform: perspective(900px) translateY(34px) rotateX(-14deg) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes cardIn { from { opacity: 0; transform: perspective(1100px) translateY(60px) rotateX(-18deg) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes sweep { 0%,55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
@keyframes spinCube { from { transform: rotateX(-24deg) rotateY(0deg); } to { transform: rotateX(336deg) rotateY(360deg); } }
@keyframes drift { 0%,100% { transform: translate3d(0,0,0); } 50% { transform: translate3d(26px,-38px,0); } }
@keyframes glowPulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.18); } }
@keyframes particleUp { 0% { transform: translateY(105vh) translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(-15vh) translateX(70px); opacity: 0; } }
@keyframes ringPulse { 0% { box-shadow: 0 0 0 0 rgba(76,125,255,.5); } 100% { box-shadow: 0 0 0 16px rgba(76,125,255,0); } }
.rise { animation: rise .9s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 90ms); }

/* ---------- 3D CUBES + SCENE ---------- */
.cube-wrap { position: absolute; perspective: 700px; pointer-events: none; }
.cube { --s: 60px; width: var(--s); height: var(--s); position: relative; transform-style: preserve-3d; animation: spinCube 18s linear infinite; }
.cube i { position: absolute; inset: 0; border: 1.5px solid rgba(170,196,255,.6); background: linear-gradient(135deg, rgba(76,125,255,.30), rgba(255,255,255,.06)); box-shadow: inset 0 0 18px rgba(120,160,255,.28); }
.cube i:nth-child(1) { transform: translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(2) { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(3) { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(4) { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(5) { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.cube i:nth-child(6) { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
.scene { position: fixed; inset: 0; perspective: 1000px; overflow: hidden; pointer-events: none; z-index: 0; }
.scene-inner { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(calc(var(--py, 0) * -3deg)) rotateY(calc(var(--px, 0) * 3deg)); transition: transform .35s ease-out; }
.glow { position: absolute; border-radius: 50%; filter: blur(60px); animation: glowPulse 9s ease-in-out infinite; }
.glow.g1 { width: 420px; height: 420px; left: -120px; top: -100px; background: rgba(76,125,255,.45); }
.glow.g2 { width: 520px; height: 520px; right: -160px; bottom: -180px; background: rgba(31,79,224,.5); animation-delay: 3s; }
#particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.particle { position: absolute; top: 0; width: 3px; height: 3px; border-radius: 50%; background: #d6e4ff; box-shadow: 0 0 8px #8fb0ff, 0 0 16px #4c7dff; opacity: 0; animation: particleUp linear infinite; }
/* on light pages the cubes sit softly behind the content */
body:not(.auth-body) .scene .cube i { border-color: rgba(76,125,255,.35); background: linear-gradient(135deg, rgba(76,125,255,.14), rgba(255,255,255,.05)); }
body:not(.auth-body) .particle { background: #8fb0ff; box-shadow: 0 0 8px #4c7dff; }

/* ---------- SIDEBAR ---------- */
.sidebar {
    position: fixed; inset: 0 auto 0 0; width: 270px; padding: 22px 16px; display: flex; flex-direction: column;
    z-index: 1000; color: #fff; overflow-y: auto;
    background: radial-gradient(circle at 20% 0%, rgba(76,125,255,.5), transparent 46%), linear-gradient(180deg, #0f2878 0%, #0a1b5c 55%, #07123a 100%);

}

.sb-nav a { display: flex; align-items: center; gap: 14px; padding: 13px 15px; border-radius: 12px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.86); transition: transform .25s var(--ease), background .25s ease, color .25s ease, box-shadow .25s ease; }
.sb-nav a:hover { background: rgba(255,255,255,.13); color: #fff; transform: translateX(5px); }
.sb-nav a.active { background: #fff; color: var(--royal-700); transform: translateX(5px); box-shadow: 0 12px 26px rgba(0,0,0,.28); }

.sb-user strong { display: block; font-size: 12px; }
.sb-user span { display: block; font-size: 10px; opacity: .7; }
.logout { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #ffd9de; background: rgba(229,56,76,.18); border: 1px solid rgba(229,56,76,.3); transition: .25s ease; }
.logout:hover { background: rgba(229,56,76,.34); transform: translateY(-2px); }
.pic { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; object-fit: cover; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(135deg, var(--azure), var(--royal-700)); box-shadow: 0 6px 16px rgba(31,79,224,.4); }

/* ---------- MAIN + TOPBAR ---------- */
.main { margin-left: 270px; min-height: 100vh; position: relative; z-index: 1; }
.topbar { position: sticky; top: 0; z-index: 100; min-height: 78px; padding: 12px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: rgba(255,255,255,.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); box-shadow: 0 8px 28px rgba(21,53,160,.08); }
.tb-left { display: flex; align-items: center; gap: 15px; }
.page-title h1 { font-size: 22px; font-weight: 800; color: var(--royal-800); margin-bottom: 3px; }
.page-title p { font-size: 12px; color: var(--muted); }
.back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--royal); transition: .2s ease; }
.back-link:hover { color: var(--royal-800); transform: translateX(-3px); }
.top-profile { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), box-shadow .25s ease; }
a.top-profile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.top-profile strong { display: block; font-size: 12px; color: var(--royal-800); }
.top-profile span { display: block; font-size: 10px; color: var(--muted); }
.mobile-menu { display: none; width: 42px; height: 42px; border: none; border-radius: 12px; font-size: 18px; cursor: pointer; color: #fff; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--azure), var(--royal-700)); box-shadow: 0 5px 0 var(--royal-800), 0 12px 22px rgba(31,79,224,.35); }
.mobile-menu:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--royal-800); }
.content { padding: 34px 40px 56px; max-width: 1500px; }

/* ---------- 3D CARDS, HERO, BUTTONS ---------- */
.card3d { position: relative; background: #fff; border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); transform-style: preserve-3d; will-change: transform; transition: transform .16s ease-out, box-shadow .3s ease, border-color .3s ease; }
.card3d::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .3s ease; background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 0%), rgba(76,125,255,.16), transparent 45%); }
.card3d:hover { box-shadow: var(--shadow); border-color: #b7c9fa; }
.card3d:hover::before { opacity: 1; }
.panel { padding: 26px; }
.hero { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between; gap: 28px; padding: 38px 44px; margin-bottom: 30px; border-radius: 24px; color: #fff; background: radial-gradient(circle at 88% 8%, rgba(130,168,255,.6), transparent 42%), linear-gradient(120deg, #0a1b5c 0%, #1535a0 48%, #1f4fe0 100%); box-shadow: 0 28px 60px rgba(21,53,160,.4), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .16s ease-out; will-change: transform; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.16) 50%, transparent 70%); animation: sweep 7s ease-in-out infinite; pointer-events: none; }

.hero-logo { position: relative; z-index: 2; width: 250px; max-width: 38%; height: auto; flex-shrink: 0; filter: drop-shadow(0 18px 34px rgba(0,0,0,.5)); animation: floatY 5s ease-in-out infinite; }

.btn3d { display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 13px 24px; border: none; border-radius: 13px; font-family: inherit; font-size: 14px; font-weight: 800; color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--azure), var(--royal)); box-shadow: 0 6px 0 var(--royal-800), 0 16px 28px rgba(31,79,224,.38); transition: transform .2s var(--ease), box-shadow .2s ease; }
.btn3d:hover { transform: translateY(-3px); box-shadow: 0 9px 0 var(--royal-800), 0 22px 34px rgba(31,79,224,.44); }

.btn3d.white { background: #fff; color: var(--royal-700); box-shadow: 0 6px 0 #b9cdff, 0 16px 28px rgba(0,0,0,.25); }

.btn3d.white:active { box-shadow: 0 2px 0 #b9cdff; }
.btn3d.outline { background: #fff; color: var(--royal-700); border: 1.5px solid var(--royal); box-shadow: 0 5px 0 #b9cdff, 0 12px 22px rgba(31,79,224,.15); }
.btn3d.outline:hover { box-shadow: 0 8px 0 #b9cdff, 0 18px 28px rgba(31,79,224,.2); }
.btn3d.block { width: 100%; }
.btn3d.sm { padding: 10px 16px; font-size: 13px; }

.section-heading, .section-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.section-heading h3, .section-header h2 { font-size: 19px; font-weight: 800; color: var(--royal-800); }
.section-heading span, .section-header span { font-size: 12px; color: var(--muted); }
.section-header p { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.6; }

.stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 20px; margin-bottom: 30px; }
.stats-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.stat-card { display: flex; align-items: center; gap: 16px; padding: 22px; }
.stat-icon { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; flex-shrink: 0; font-size: 21px; color: #fff; background: linear-gradient(135deg, var(--azure), var(--royal-700)); box-shadow: 0 12px 24px rgba(31,79,224,.4), inset 0 1px 0 rgba(255,255,255,.45); transform: translateZ(34px); }
.stat-info strong { display: block; font-size: 25px; font-weight: 800; line-height: 1.15; color: var(--royal-800); }
.stat-info span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; }

.tile { display: block; padding: 20px; border-radius: 16px; background: linear-gradient(160deg, #fff, var(--sky)); border: 1px solid var(--border); transition: transform .3s var(--ease), box-shadow .3s ease, border-color .3s ease; }
.tile:hover { transform: translateY(-6px) rotateX(4deg); border-color: var(--azure); box-shadow: 0 18px 34px rgba(31,79,224,.18); }
.tile-icon { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 14px; font-size: 19px; color: #fff; background: linear-gradient(135deg, var(--azure), var(--royal-700)); box-shadow: 0 10px 20px rgba(31,79,224,.35), inset 0 1px 0 rgba(255,255,255,.4); }
.tile h4 { font-size: 14px; font-weight: 800; color: var(--royal-800); margin-bottom: 5px; }

.tile-link { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 800; color: var(--royal); }
.tile:hover .tile-link i { transform: translateX(4px); }
.tile-link i { transition: transform .2s ease; }

/* ---------- FORMS ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label, .flabel { font-size: 12.5px; font-weight: 700; color: var(--royal-800); }
.field label span { color: var(--danger); }
.field input, .field select {
    width: 100%; padding: 13px 15px; border: 1.5px solid var(--border); border-radius: 12px; background: #f7faff;
    font-family: inherit; font-size: 14px; color: var(--text); transition: transform .25s var(--ease), box-shadow .25s ease, border-color .25s ease, background .25s ease;
}
.field input::placeholder { color: #8a98bf; }
.field input:focus, .field select:focus { outline: none; border-color: var(--azure); background: #fff; transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(76,125,255,.18), 0 12px 24px rgba(21,53,160,.12); }
.field input[readonly] { background: var(--sky); color: var(--muted); cursor: not-allowed; }
.field input[type="file"] { padding: 10px 12px; background: #fff; }

.hint.warn { color: var(--danger); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 800; color: var(--royal-700); background: var(--sky); border: 1px solid var(--border); }
.note-box { padding: 16px 18px; border-radius: 14px; background: linear-gradient(135deg, var(--ice), #fff); border: 1px solid var(--border); border-left: 4px solid var(--royal); }
.note-box strong { display: block; font-size: 13.5px; color: var(--royal-800); margin-bottom: 5px; }
.note-box p, .note-box li { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.note-box ul { padding-left: 18px; }
.form-actions { display: flex; justify-content: flex-end; gap: 14px; margin-top: 26px; flex-wrap: wrap; }

/* ---------- FLASH ---------- */
.flash-wrap { margin-bottom: 22px; }
.flash { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-radius: 12px; margin-bottom: 10px; font-size: 13.5px; font-weight: 600; background: #fff0f2; color: var(--danger); border: 1px solid #f6c0c7; box-shadow: var(--shadow-sm); animation: rise .6s var(--ease) backwards; }
.flash.success { background: #ecfaf2; color: var(--success); border-color: #a9e3c3; }

/* ---------- TABLES + BADGES ---------- */
.table-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.table-head h3 { font-size: 19px; font-weight: 800; color: var(--royal-800); }
.table-head p, .table-head > div > span { font-size: 12px; color: var(--muted); margin-top: 3px; display: block; }
.search-box { position: relative; width: 240px; }

.search-box input { width: 100%; padding: 11px 12px 11px 36px; border: 1.5px solid var(--border); border-radius: 11px; background: #f7faff; font-family: inherit; font-size: 12.5px; color: var(--text); outline: none; transition: .25s ease; }
.search-box input:focus { border-color: var(--azure); background: #fff; box-shadow: 0 0 0 4px rgba(76,125,255,.16); }

.badge.alt { background: #fff; color: var(--royal-800); }

/* ---------- AUTH PAGES ---------- */
.auth-body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 30px; position: relative; overflow-x: hidden; background: radial-gradient(circle at 18% 22%, rgba(76,125,255,.4), transparent 42%), radial-gradient(circle at 85% 78%, rgba(31,79,224,.4), transparent 42%), linear-gradient(160deg, #0a1b5c 0%, #07123a 55%, #040b26 100%); background-attachment: fixed; }
.auth-card { position: relative; z-index: 10; width: 430px; max-width: 100%; padding: 30px 36px 34px; border-radius: 28px; color: #fff; background: linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.26); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: 0 40px 90px rgba(2,8,35,.65), inset 0 1px 0 rgba(255,255,255,.38); transform-style: preserve-3d; transition: transform .2s ease-out; animation: cardIn 1.1s var(--ease) backwards; }

.auth-logo img { width: 250px; max-width: 86%; height: auto; animation: floatY 5s ease-in-out infinite; filter: drop-shadow(0 16px 30px rgba(0,0,0,.5)); }
.auth-title { text-align: center; font-size: 15px; font-weight: 700; letter-spacing: .6px; color: #dce8ff; margin: 4px 0 14px; }
.auth-title::before, .auth-title::after { content: "\2014"; color: #7fa2ff; margin: 0 9px; font-weight: 400; }
.auth-text { text-align: center; font-size: 13.5px; line-height: 1.7; color: #c4d6ff; margin-bottom: 22px; }
.auth-field { margin-bottom: 16px; }

html[data-theme="light"] body.auth-body .scene .cube i { border-color: rgba(76,125,255,.35); background: linear-gradient(135deg, rgba(76,125,255,.14), rgba(255,255,255,.05)); }
}

<body class="auth-body" data-scene>
    <div class="auth-card" data-tilt="5" data-nolift>
        <div class="auth-logo"><img src="{{ url_for('static', filename='images/qgen-logo.png') }}" alt="QGEN-AI"></div>
        <div class="logout-icon"><i class="fa-solid fa-face-smile"></i></div>
        <h1>You have been logged out</h1>
        <p>Thank you for using QGEN-AI.<br>See you again soon!</p>

        <div class="timer-wrapper">
            <div class="timer-circle" id="timerCircle" style="--progress: 100;"><div class="timer-number" id="countdown">3</div></div>
            <div class="timer-text">Redirecting to Home...</div>
        </div>

        <a href="{{ url_for('index') }}" class="btn3d white">Back to Home Now</a>
    </div>

<script>
    let timeLeft = 3;
    const countdownEl = document.getElementById('countdown');
    const timerCircle = document.getElementById('timerCircle');

    const timer = setInterval(() => {
        timeLeft--;
        countdownEl.textContent = timeLeft;

        // Update circular progress (100% → 66% → 33% → 0%)
        const progress = (timeLeft / 3) * 100;
        timerCircle.style.setProperty('--progress', progress);

        if (timeLeft <= 0) {
            clearInterval(timer);
            countdownEl.textContent = "0";
            timerCircle.style.setProperty('--progress', 0);

            // Small delay for visual finish then redirect
            setTimeout(() => {
                window.location.href = "{{ url_for('index') }}";
            }, 300);
        }
    }, 1000);
</script>
<script>
/* =====================================================
   QGEN-AI | shared 3D effects
   - [data-tilt]   3D tilt + glare on hover (value = max degrees)
   - [data-count]  animated number counter
   - body[data-scene]  floating 3D cubes + glow + particles
   - toggleSidebar()   mobile sidebar toggle
===================================================== */
(function () {
    "use strict";

    var doc = document;
    var root = doc.documentElement;
    var fine = !window.matchMedia("(pointer: coarse)").matches;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    window.toggleSidebar = function () {
        var s = doc.getElementById("sidebar");
        if (s) s.classList.toggle("show");
    };

    function buildScene() {
        if (!doc.body.hasAttribute("data-scene")) return;

        // left %, top %, size px, spin seconds
        var cubes = [
            [6, 12, 74, 26], [84, 14, 52, 20], [10, 70, 50, 18],
            [86, 64, 96, 30], [47, 5, 34, 16], [68, 86, 40, 22]
        ];
        var faces = "<i></i><i></i><i></i><i></i><i></i><i></i>";
        var html = '<div class="scene" aria-hidden="true"><div class="scene-inner">' +
                   '<span class="glow g1"></span><span class="glow g2"></span>';

        cubes.forEach(function (c, i) {
            html += '<div class="cube-wrap" style="left:' + c[0] + "%;top:" + c[1] +
                    "%;animation:drift " + (10 + i * 2) + 's ease-in-out infinite">' +
                    '<div class="cube" style="--s:' + c[2] + "px;animation-duration:" + c[3] + 's">' +
                    faces + "</div></div>";
        });

        html += '</div></div><div id="particles"></div>';
        doc.body.insertAdjacentHTML("afterbegin", html);
    }

    function buildParticles() {
        var box = doc.getElementById("particles");
        if (!box || reduce || box.children.length) return;

        for (var i = 0; i < 42; i++) {
            var p = doc.createElement("span");
            var size = 2 + Math.random() * 3;
            p.className = "particle";
            p.style.left = Math.random() * 100 + "%";
            p.style.width = p.style.height = size + "px";
            p.style.animationDuration = (8 + Math.random() * 12) + "s";
            p.style.animationDelay = (Math.random() * 10) + "s";
            box.appendChild(p);
        }
    }

    function initTilt() {
        if (!fine || reduce) return;

        doc.querySelectorAll("[data-tilt]").forEach(function (el) {
            var max = parseFloat(el.getAttribute("data-tilt")) || 7;
            var lift = el.hasAttribute("data-nolift") ? 0 : 4;

            el.addEventListener("mousemove", function (e) {
                var r = el.getBoundingClientRect();
                var x = e.clientX - r.left;
                var y = e.clientY - r.top;
                var ry = ((x / r.width) - 0.5) * 2 * max;
                var rx = -((y / r.height) - 0.5) * 2 * max;

                el.style.setProperty("--mx", x + "px");
                el.style.setProperty("--my", y + "px");
                el.style.transform =
                    "perspective(1000px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) +
                    "deg) translateY(-" + lift + "px) scale(1.012)";
            });

            el.addEventListener("mouseleave", function () {
                el.style.transform = "";
            });
        });
    }

    function initCounters() {
        if (reduce) return;

        doc.querySelectorAll("[data-count]").forEach(function (el) {
            var end = parseInt(el.getAttribute("data-count"), 10);
            if (isNaN(end)) return;

            var start = null;
            var duration = 1100;
            el.textContent = "0";

            function step(ts) {
                if (start === null) start = ts;
                var p = Math.min((ts - start) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(end * eased);
                if (p < 1) requestAnimationFrame(step);
                else el.textContent = end;
            }
            requestAnimationFrame(step);
        });
    }

    function initParallax() {
        if (!fine || reduce) return;

        doc.addEventListener("mousemove", function (e) {
            root.style.setProperty("--px", ((e.clientX / window.innerWidth) - 0.5) * 2);
            root.style.setProperty("--py", ((e.clientY / window.innerHeight) - 0.5) * 2);
        });
    }

    function initSidebarOutsideClick() {
        doc.addEventListener("click", function (e) {
            var s = doc.getElementById("sidebar");
            if (!s || !s.classList.contains("show")) return;
            if (s.contains(e.target) || e.target.closest(".mobile-menu")) return;
            s.classList.remove("show");
        });
    }

    function init() {
        buildScene();
        buildParticles();
        initTilt();
        initCounters();
        initParallax();
        initSidebarOutsideClick();
    }

    if (doc.readyState !== "loading") init();
    else doc.addEventListener("DOMContentLoaded", init);
})();

</script>
<script>
/* QGEN-AI shared theme: keep every open page in sync with the index toggle */
(function(){
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    var b=document.body; if(!b) return;
    if(b.classList.contains('dark')||b.classList.contains('light')){b.classList.remove('dark','light');b.classList.add(t);}
  }
  window.addEventListener('storage',function(e){ if(e.key==='qgen-theme') apply(e.newValue==='light'?'light':'dark'); });
  window.qgenSetTheme=function(t){ t=(t==='light')?'light':'dark'; try{localStorage.setItem('qgen-theme',t);}catch(e){} apply(t); return t; };
  apply(document.documentElement.getAttribute('data-theme'));
})();
</script>
