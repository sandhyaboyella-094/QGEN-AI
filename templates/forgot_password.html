<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | QGEN-AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --maroon: #82193A;
            --dark-maroon: #5c1229;
            --cream: #FEE3C5;
            --gold: #e7ad55;
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 20% 25%, rgba(130,25,58,.35), transparent 42%),
                radial-gradient(circle at 80% 70%, rgba(156,34,72,.25), transparent 42%),
                linear-gradient(160deg, #1a0a10, #12060c 50%, #0d0408);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(2px);
            opacity: .22;
            animation: floatOrb 13s ease-in-out infinite;
        }
        .orb1 {
            width: 280px; height: 280px;
            top: 70px; left: -60px;
            background: radial-gradient(circle at 30% 30%, #82193A, #4a0f22);
        }
        .orb2 {
            width: 200px; height: 200px;
            right: -50px; bottom: 110px;
            background: radial-gradient(circle at 30% 30%, #9c2248, #5c1229);
            animation-delay: 2.5s;
        }
        @keyframes floatOrb {
            0%,100% { transform: translate(0,0); }
            33% { transform: translate(18px,-30px); }
            66% { transform: translate(-18px,-12px); }
        }

        /* 3D Card */
        .box {
            width: 440px;
            max-width: 95%;
            background: linear-gradient(145deg, #FEE3C5, #fce9d2);
            border-radius: 28px;
            padding: 48px 40px;
            text-align: center;
            position: relative;
            z-index: 5;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.55);
            box-shadow:
                0 30px 80px rgba(0,0,0,.4),
                0 12px 35px rgba(130,25,58,.22);
            animation: cardIn .85s ease both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(35px) scale(.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Shine effect */
        .box::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 45%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
            transform: skewX(-20deg);
            animation: shine 5.5s 1.1s infinite;
        }
        @keyframes shine {
            0%   { left: -100%; }
            20%  { left: 130%; }
            100% { left: 130%; }
        }

        /* Logo */
        .logo {
            width: 160px;
            height: auto;
            margin: 0 auto 26px;
            display: block;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 18px rgba(130,25,58,.2));
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--maroon);
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        p {
            color: #6b3a3a;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }

        form {
            position: relative;
            z-index: 2;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--dark-maroon);
            margin-bottom: 7px;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid rgba(130,25,58,.18);
            border-radius: 12px;
            background: rgba(255,255,255,.7);
            font-size: 14px;
            color: #3d1f1f;
            outline: none;
            transition: .3s ease;
            font-family: inherit;
        }

        input[type="email"]:focus {
            border-color: var(--maroon);
            background: white;
            box-shadow: 0 0 0 4px rgba(130,25,58,.12);
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #82193A, #9c2248);
            color: var(--cream);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(130,25,58,.4);
            transition: .3s ease;
        }
        button[type="submit"]:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(130,25,58,.5);
        }

        .back {
            margin-top: 26px;
            position: relative;
            z-index: 2;
        }
        .back a {
            color: var(--maroon);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: .3s ease;
        }
        .back a:hover {
            color: var(--dark-maroon);
            letter-spacing: .3px;
        }

        /* Flash messages */
        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            z-index: 2;
        }
        .flash.success {
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .flash.error {
            background: rgba(220, 38, 38, 0.12);
            color: #b91c1c;
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        @media (max-width: 480px) {
            .box { padding: 40px 24px; }
            .logo { width: 140px; }
            h2 { font-size: 24px; }
        }
    </style>
</head>

<body>

    <!-- Floating Orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <div class="box">

        <!-- Logo -->
        <img src="{{ url_for('static', filename='images/qgen-logo-old.png') }}" 
             alt="QGEN-AI" 
             class="logo">

        <h2>Forgot Password?</h2>

        <p>
            Enter your registered faculty email address<br>
            and we’ll help you reset it.
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Faculty Email</label>
            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <button type="submit">
                Continue
            </button>
        </form>

        <div class="back">
            <a href="{{ url_for('faculty_login') }}">
                ← Back to Login
            </a>
        </div>

    </div>

</body>
</html>
