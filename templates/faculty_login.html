<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Faculty / HOD Login | AI Question Paper Generator</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(130, 25, 58, 0.42),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(130, 25, 58, 0.32),
                    transparent 40%
                ),
                linear-gradient(
                    160deg,
                    #1a0a10 0%,
                    #12060c 50%,
                    #0d0408 100%
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND ORBS
        ===================================================== */

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.28;

            animation:
                floatOrb
                11s
                ease-in-out
                infinite;
        }

        .orb1 {
            width: 300px;
            height: 300px;

            top: 20px;
            left: -60px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #82193A,
                    #3d0c1b
                );
        }

        .orb2 {
            width: 220px;
            height: 220px;

            top: 48%;
            right: -50px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #9c2248,
                    #5c1229
                );

            animation-delay: 3s;
        }

        .orb3 {
            width: 160px;
            height: 160px;

            bottom: 6%;
            left: 6%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #82193A,
                    #2a0814
                );

            animation-delay: 5.5s;
        }

        @keyframes floatOrb {

            0%,
            100% {
                transform:
                    translate(0, 0);
            }

            33% {
                transform:
                    translate(14px, -28px);
            }

            66% {
                transform:
                    translate(-18px, -12px);
            }
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-container {

            width: 420px;
            max-width: 100%;

            background:
                linear-gradient(
                    160deg,
                    #FFF8F0 0%,
                    #FEE3C5 100%
                );

            padding:
                28px 36px 36px;

            border-radius:
                22px;

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.5),
                0 15px 35px rgba(130, 25, 58, 0.2);

            border:
                1px solid
                rgba(254, 227, 197, 0.6);

            position:
                relative;

            z-index:
                10;

            overflow:
                hidden;

            animation:
                cardEntrance
                0.9s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                );
        }

        @keyframes cardEntrance {

            from {
                opacity: 0;
                transform:
                    translateY(40px)
                    scale(0.95);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           PROJECT ILLUSTRATION
        ===================================================== */

        .project-image {

            width: 170px;
            height: 130px;

            margin:
                0 auto 12px;

            position:
                relative;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            animation:
                illustrationFloat
                4s
                ease-in-out
                infinite;
        }

        @keyframes illustrationFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-6px);
            }
        }


        /* =====================================================
           QUESTION PAPER
        ===================================================== */

        .paper {

            width: 105px;
            height: 122px;

            background:
                #fffdf9;

            border:
                2px solid
                #82193A;

            border-radius:
                9px;

            position:
                absolute;

            right: 19px;
            top: 5px;

            box-shadow:
                0 12px 25px
                rgba(130, 25, 58, 0.2);

            transform:
                rotate(4deg);

            z-index:
                2;
        }

        .paper-title {

            width: 65px;
            height: 8px;

            background:
                #82193A;

            border-radius:
                4px;

            margin:
                17px auto 10px;
        }

        .paper-line {

            width: 68px;
            height: 5px;

            background:
                #d8b7a8;

            border-radius:
                5px;

            margin:
                7px auto;
        }

        .paper-line.short {
            width: 45px;
        }


        /* =====================================================
           QUESTION MARKS
        ===================================================== */

        .question {

            position:
                absolute;

            font-family:
                'Playfair Display',
                serif;

            font-weight:
                700;

            color:
                #82193A;

            font-size:
                15px;
        }

        .question.q1 {
            top: 49px;
            left: 20px;
            transform: rotate(-12deg);
        }

        .question.q2 {
            top: 80px;
            left: 29px;
            transform: rotate(8deg);
        }


        /* =====================================================
           AI BRAIN
        ===================================================== */

        .ai-brain {

            width: 70px;
            height: 70px;

            border-radius:
                50%;

            background:
                linear-gradient(
                    135deg,
                    #82193A,
                    #9c2248
                );

            position:
                absolute;

            left: 4px;
            top: 29px;

            z-index:
                4;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            box-shadow:
                0 10px 25px
                rgba(130, 25, 58, 0.35);

            border:
                4px solid
                #FEE3C5;
        }

        .brain-symbol {

            color:
                #FEE3C5;

            font-size:
                37px;

            line-height:
                1;

            font-weight:
                700;
        }


        /* =====================================================
           AI CONNECTION LINES
        ===================================================== */

        .connection {

            position:
                absolute;

            height:
                2px;

            background:
                #9c2248;

            opacity:
                0.65;

            z-index:
                1;

            transform-origin:
                left center;
        }

        .connection.c1 {
            width: 38px;
            left: 59px;
            top: 52px;
            transform: rotate(-20deg);
        }

        .connection.c2 {
            width: 40px;
            left: 58px;
            top: 81px;
            transform: rotate(20deg);
        }


        /* =====================================================
           SMALL AI NODES
        ===================================================== */

        .node {

            width: 8px;
            height: 8px;

            border-radius:
                50%;

            background:
                #9c2248;

            position:
                absolute;

            z-index:
                5;

            box-shadow:
                0 0 10px
                rgba(156, 34, 72, 0.4);
        }

        .node.n1 {
            left: 26px;
            top: 18px;
        }

        .node.n2 {
            left: 18px;
            bottom: 19px;
        }

        .node.n3 {
            right: 8px;
            top: 27px;
        }


        /* =====================================================
           PENCIL
        ===================================================== */

        .pencil {

            position:
                absolute;

            width:
                58px;

            height:
                9px;

            background:
                #82193A;

            right:
                0;

            bottom:
                4px;

            border-radius:
                5px;

            transform:
                rotate(-35deg);

            z-index:
                6;

            box-shadow:
                0 5px 10px
                rgba(130, 25, 58, 0.2);
        }

        .pencil::before {

            content:
                "";

            position:
                absolute;

            left:
                -9px;

            top:
                0;

            border-top:
                4.5px solid transparent;

            border-bottom:
                4.5px solid transparent;

            border-right:
                10px solid
                #d9b7a6;
        }

        .pencil::after {

            content:
                "";

            position:
                absolute;

            right:
                -7px;

            top:
                0;

            width:
                7px;

            height:
                9px;

            background:
                #d9b7a6;

            border-radius:
                0 5px 5px 0;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            text-align:
                center;

            font-size:
                20px;

            font-weight:
                700;

            color:
                #82193A;

            margin-bottom:
                4px;

            font-family:
                'Playfair Display',
                serif;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        h2 {

            text-align:
                center;

            color:
                #82193A;

            font-size:
                15px;

            font-weight:
                600;

            margin-bottom:
                24px;

            letter-spacing:
                0.5px;
        }

        h2::before,
        h2::after {

            content:
                "—";

            color:
                #c9a08a;

            margin:
                0 8px;

            font-weight:
                400;
        }


        /* =====================================================
           FLASH MESSAGE
        ===================================================== */

        .message {

            padding:
                10px;

            border-radius:
                8px;

            text-align:
                center;

            margin-bottom:
                16px;

            font-size:
                13.5px;

            font-weight:
                500;
        }

        .message,
        .message.error {

            background:
                #fde8e8;

            color:
                #9c2248;

            border:
                1px solid
                #f5c2c7;
        }

        .message.success {

            background:
                #e8f8ef;

            color:
                #1a7a45;

            border:
                1px solid
                #a3d9b8;
        }


        /* =====================================================
           INPUT GROUP
        ===================================================== */

        .input-group {

            position:
                relative;

            margin-bottom:
                16px;
        }


        /* =====================================================
           INPUT ICON
        ===================================================== */

        .input-group img.icon {

            position:
                absolute;

            left:
                14px;

            top:
                50%;

            transform:
                translateY(-50%);

            width:
                18px;

            height:
                18px;

            opacity:
                0.7;

            z-index:
                2;

            pointer-events:
                none;
        }


        /* =====================================================
           TEXT INPUT
        ===================================================== */

        .input-group input {

            width:
                100%;

            padding:
                13px 45px 13px 44px;

            border:
                1.5px solid
                rgba(130, 25, 58, 0.18);

            border-radius:
                10px;

            font-size:
                14.5px;

            background:
                #fffdf9;

            color:
                #3d0c1b;

            transition:
                all 0.25s ease;
        }

        .input-group input:hover {

            border-color:
                rgba(130, 25, 58, 0.35);
        }

        .input-group input:focus {

            outline:
                none;

            border-color:
                #82193A;

            box-shadow:
                0 0 0 3px
                rgba(130, 25, 58, 0.12);

            background:
                #ffffff;
        }

        .input-group input::placeholder {

            color:
                #b08989;
        }


        /* =====================================================
           ROLE SELECT
        ===================================================== */

        .input-group select {

            width:
                100%;

            padding:
                13px 45px 13px 44px;

            border:
                1.5px solid
                rgba(130, 25, 58, 0.18);

            border-radius:
                10px;

            font-size:
                14.5px;

            background:
                #fffdf9;

            color:
                #3d0c1b;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

            appearance:
                none;
        }

        .input-group select:hover {

            border-color:
                rgba(130, 25, 58, 0.35);
        }

        .input-group select:focus {

            outline:
                none;

            border-color:
                #82193A;

            box-shadow:
                0 0 0 3px
                rgba(130, 25, 58, 0.12);

            background:
                #ffffff;
        }

        .input-group select:invalid {

            color:
                #b08989;
        }

        .input-group select option {

            color:
                #3d0c1b;

            background:
                #fffdf9;
        }


        /* =====================================================
           PASSWORD EYE
        ===================================================== */

        .toggle-password {

            position:
                absolute;

            right:
                14px;

            top:
                50%;

            transform:
                translateY(-50%);

            width:
                20px;

            height:
                20px;

            cursor:
                pointer;

            opacity:
                0.55;

            z-index:
                3;

            transition:
                all 0.25s ease;
        }

        .toggle-password:hover {

            opacity:
                1;

            transform:
                translateY(-50%)
                scale(1.1);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width:
                100%;

            margin-top:
                10px;

            padding:
                14px;

            border:
                none;

            border-radius:
                11px;

            background:
                linear-gradient(
                    135deg,
                    #82193A,
                    #9c2248
                );

            color:
                #FEE3C5;

            font-size:
                15.5px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.3s ease;

            box-shadow:
                0 8px 20px
                rgba(130, 25, 58, 0.3);
        }

        .login-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 12px 26px
                rgba(130, 25, 58, 0.4);
        }

        .login-btn:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {

            text-align:
                center;

            margin-top:
                22px;

            font-size:
                13.5px;

            color:
                #6b3a3a;

            line-height:
                2.1;
        }

        .links a {

            color:
                #82193A;

            font-weight:
                600;

            text-decoration:
                none;
        }

        .links a:hover {

            text-decoration:
                underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding:
                    20px;

                align-items:
                    flex-start;
            }

            .login-container {

                width:
                    100%;

                margin:
                    20px 0;

                padding:
                    25px 24px 30px;
            }

            .project-image {

                transform:
                    scale(0.9);
            }

            .logo {

                font-size:
                    18px;
            }

            .orb1 {

                width:
                    200px;

                height:
                    200px;
            }

            .orb2 {

                width:
                    150px;

                height:
                    150px;
            }

            .orb3 {

                width:
                    110px;

                height:
                    110px;
            }
        }


        /* =====================================================
           ACCESSIBILITY
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>


    <!-- =====================================================
         LOGIN CARD
    ===================================================== -->

    <div class="login-container">


        <!-- =================================================
             PROJECT ILLUSTRATION
        ================================================= -->

        <div class="project-image">


            <!-- AI Brain -->

            <div class="ai-brain">

                <div class="brain-symbol">
                    AI
                </div>

            </div>


            <!-- AI Nodes -->

            <div class="node n1"></div>

            <div class="node n2"></div>

            <div class="node n3"></div>


            <!-- Connection Lines -->

            <div class="connection c1"></div>

            <div class="connection c2"></div>


            <!-- Question Paper -->

            <div class="paper">

                <div class="paper-title"></div>

                <div class="question q1">
                    Q?
                </div>

                <div class="paper-line"></div>

                <div class="paper-line short"></div>

                <div class="question q2">
                    ?
                </div>

                <div class="paper-line"></div>

                <div class="paper-line short"></div>

            </div>


            <!-- Pencil -->

            <div class="pencil"></div>


        </div>


        <!-- =================================================
             PROJECT NAME
        ================================================= -->

        <div class="logo">

            AI Question Paper Generator

        </div>


        <!-- =================================================
             LOGIN HEADING
        ================================================= -->

        <h2>

            Faculty / HOD Login

        </h2>


        <!-- =================================================
             FLASH MESSAGES
        ================================================= -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category if category in ['success', 'error'] else 'error' }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <form method="POST">


            <!-- =============================================
                 FACULTY EMAIL
            ============================================== -->

            <div class="input-group">

                <img
                    class="icon"
                    src="https://cdn-icons-png.flaticon.com/512/732/732200.png"
                    alt="Email">

                <input
                    type="email"
                    name="email"
                    placeholder="Enter faculty email"
                    autocomplete="email"
                    required>

            </div>


            <!-- =============================================
                 PASSWORD
            ============================================== -->

            <div class="input-group">

                <img
                    class="icon"
                    src="https://cdn-icons-png.flaticon.com/512/3064/3064155.png"
                    alt="Password">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required>

                <img
                    class="toggle-password"
                    src="https://cdn-icons-png.flaticon.com/512/709/709612.png"
                    onclick="togglePassword('password', this)"
                    alt="Show password">

            </div>


            <!-- =============================================
                 ROLE
            ============================================== -->

            <div class="input-group">

                <img
                    class="icon"
                    src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png"
                    alt="Role">

                <select
                    name="role"
                    required>

                    <option value="" disabled selected>
                        Select Role
                    </option>

                    <option value="faculty">
                        Faculty
                    </option>

                    <option value="hod">
                        HOD
                    </option>

                </select>

            </div>


            <!-- =============================================
                 LOGIN BUTTON
            ============================================== -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


        </form>


        <!-- =================================================
             LINKS
        ================================================= -->

        <div class="links">


            <a
                href="{{ url_for('forgot_password') }}">

                Forgot Password?

            </a>


            <br>


            <a
                href="{{ url_for('register') }}">

                Create Faculty Account

            </a>


            <br>


            <a
                href="{{ url_for('index') }}">

                ← Back to Home

            </a>


        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        function togglePassword(id, icon) {

            const input =
                document.getElementById(id);

            if (input.type === "password") {

                input.type = "text";

                icon.style.opacity = "1";

            } else {

                input.type = "password";

                icon.style.opacity = "0.55";

            }

        }

    </script>


</body>

</html>
