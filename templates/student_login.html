<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | QGEN-AI</title>


    <!-- =========================================
         GOOGLE FONTS
    ========================================== -->

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================================
           BODY
        ========================================== */

        body {

            min-height: 100vh;

            font-family: 'Plus Jakarta Sans', sans-serif;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(255,255,255,0.07),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(231,173,85,0.12),
                    transparent 28%
                ),
                #5c1229;

            color: #fff8f0;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;
        }


        /* =========================================
           BACKGROUND GLOW
        ========================================== */

        .glow {

            position: absolute;

            width: 380px;

            height: 380px;

            border-radius: 50%;

            filter: blur(100px);

            pointer-events: none;

            opacity: 0.16;
        }


        .glow-one {

            background: #e7ad55;

            top: -180px;

            left: -150px;
        }


        .glow-two {

            background: #9c2248;

            bottom: -180px;

            right: -150px;
        }


        /* =========================================
           PARTICLES
        ========================================== */

        .particle {

            position: absolute;

            width: 5px;

            height: 5px;

            border-radius: 50%;

            background: rgba(255,255,255,0.35);

            pointer-events: none;

            animation:
                floatParticle 6s ease-in-out infinite;
        }


        .p1 {
            top: 12%;
            left: 10%;
        }


        .p2 {
            top: 25%;
            right: 13%;
            animation-delay: 1s;
        }


        .p3 {
            top: 65%;
            left: 7%;
            animation-delay: 2s;
        }


        .p4 {
            bottom: 15%;
            right: 20%;
            animation-delay: 3s;
        }


        .p5 {
            bottom: 25%;
            left: 22%;
            animation-delay: 1.5s;
        }


        .p6 {
            top: 15%;
            right: 35%;
            animation-delay: 2.5s;
        }


        .p7 {
            bottom: 10%;
            left: 45%;
            animation-delay: 3.5s;
        }


        @keyframes floatParticle {

            0%,
            100% {

                transform:
                    translateY(0)
                    scale(1);

                opacity: .25;
            }

            50% {

                transform:
                    translateY(-25px)
                    scale(1.25);

                opacity: .8;
            }
        }


        /* =========================================
           LOGIN HERO
        ========================================== */

        .login-card {

            width: 450px;

            max-width: 92%;

            padding: 44px;

            background: #FEE3C5;

            border: 1px solid
                rgba(255,255,255,0.55);

            border-radius: 30px;

            color: #4d2929;

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.38);

            position: relative;

            z-index: 10;

            animation:
                cardAppear .7s ease;
        }


        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =========================================
           LOGO
        ========================================== */

        .logo-area {

            text-align: center;

            margin-bottom: 24px;
        }


        .logo-area img {

            width: 195px;

            max-width: 100%;

            height: auto;
        }


        /* =========================================
           TITLE
        ========================================== */

        .title {

            text-align: center;

            font-family:
                'Playfair Display',
                serif;

            font-size: 34px;

            font-weight: 700;

            color: #4d2929;

            margin-bottom: 7px;
        }


        .subtitle {

            text-align: center;

            color: #805858;

            font-size: 13px;

            margin-bottom: 30px;

            line-height: 1.6;
        }


        /* =========================================
           FLASH MESSAGE
        ========================================== */

        .alert {

            padding: 12px 14px;

            border-radius: 11px;

            margin-bottom: 18px;

            font-size: 13px;

            background:
                rgba(180,30,50,0.10);

            border:
                1px solid
                rgba(180,30,50,0.25);

            color: #8a1d32;
        }


        /* =========================================
           FORM GROUP
        ========================================== */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;

            color: #4d2929;
        }


        /* =========================================
           INPUT BOX
        ========================================== */

        .input-box {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            color: #82193A;

            pointer-events: none;
        }


        .input-box input {

            width: 100%;

            height: 50px;

            padding:
                14px
                44px
                14px
                44px;

            border-radius: 12px;

            border:
                1px solid
                rgba(77,41,41,0.18);

            outline: none;

            background: #fff8f0;

            color: #4d2929;

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            font-size: 14px;

            transition: all .25s ease;
        }


        .input-box input::placeholder {

            color: #9a7777;
        }


        .input-box input:focus {

            border-color: #9c2248;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(156,34,72,0.10);
        }


        /* =========================================
           PASSWORD VISIBILITY TOGGLE
        ========================================== */

        .toggle-password {

            position: absolute;

            right: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            cursor: pointer;

            user-select: none;

            opacity: 0.6;

            transition: opacity .2s ease;
        }


        .toggle-password:hover {

            opacity: 1;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================== */

        .login-btn {

            width: 100%;

            height: 50px;

            border: none;

            outline: none;

            border-radius: 12px;

            background: #e7ad55;

            color: #4d2929;

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;

            transition:
                all .25s ease;
        }


        .login-btn:hover {

            background: #d99d45;

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(231,173,85,0.30);
        }


        .login-btn:active {

            transform:
                translateY(0);
        }


        /* =========================================
           CREATE ACCOUNT
        ========================================== */

        .create-account {

            text-align: center;

            margin-top: 18px;

            font-size: 13px;

            color: #805858;
        }


        .create-account a {

            color: #82193A;

            text-decoration: none;

            font-weight: 700;

            margin-left: 4px;

            transition: color 0.2s ease;
        }


        .create-account a:hover {

            color: #5c1229;

            text-decoration: underline;
        }


        /* =========================================
           BACK HOME
        ========================================== */

        .back-home {

            text-align: center;

            margin-top: 16px;
        }


        .back-home a {

            color: #82193A;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition: .2s;
        }


        .back-home a:hover {

            color: #5c1229;

            text-decoration: underline;
        }


        /* =========================================
           DECORATIVE LINE
        ========================================== */

        .gold-line {

            width: 45px;

            height: 3px;

            background: #e7ad55;

            border-radius: 10px;

            margin:
                0 auto
                25px;
        }


        /* =========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 20px;
            }


            .login-card {

                width: 100%;

                padding: 32px 25px;

                border-radius: 24px;
            }


            .title {

                font-size: 29px;
            }


            .logo-area img {

                width: 165px;
            }
        }


        @media (max-height: 650px) {

            .login-card {

                padding:
                    25px 35px;
            }


            .logo-area {

                margin-bottom: 15px;
            }


            .logo-area img {

                width: 150px;
            }


            .subtitle {

                margin-bottom: 20px;
            }


            .form-group {

                margin-bottom: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND GLOW
    ========================================== -->

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>


    <!-- =========================================
         PARTICLES
    ========================================== -->

    <div class="particle p1"></div>

    <div class="particle p2"></div>

    <div class="particle p3"></div>

    <div class="particle p4"></div>

    <div class="particle p5"></div>

    <div class="particle p6"></div>

    <div class="particle p7"></div>


    <!-- =========================================
         LOGIN HERO
    ========================================== -->

    <div class="login-card">


        <!-- LOGO -->

        <div class="logo-area">

            <img
                src="{{ url_for('static', filename='images/qgen-logo.png') }}"
                alt="QGEN-AI">

        </div>


        <!-- DECORATIVE LINE -->

        <div class="gold-line"></div>


        <!-- TITLE -->

        <h1 class="title">

            Student Login

        </h1>


        <p class="subtitle">

            Login to access your academic dashboard

        </p>


        <!-- =====================================
             FLASH MESSAGES
        ====================================== -->

        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =====================================
             LOGIN FORM
        ====================================== -->

        <form
            method="POST"
            action="{{ url_for('student_login') }}">


            <!-- UUCMS NUMBER -->

            <div class="form-group">

                <label for="uucms_number">

                    UUCMS Number

                </label>


                <div class="input-box">

                    <span class="input-icon">
                        🎓
                    </span>


                    <input
                        type="text"
                        id="uucms_number"
                        name="uucms_number"
                        placeholder="Enter your UUCMS number"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>


                    <span
                        class="toggle-password"
                        id="togglePassword"
                        onclick="togglePasswordVisibility()">
                        👁️
                    </span>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                Login

            </button>


        </form>


        <!-- =========================================
             CREATE ACCOUNT
        ========================================== -->

        <div class="create-account">

            <span>Don't have an account?</span>

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>


        <!-- =========================================
             BACK HOME
        ========================================== -->

        <div class="back-home">

            <a href="{{ url_for('index') }}">

                ← Back to Home

            </a>

        </div>


    </div>


    <!-- =========================================
         PASSWORD TOGGLE SCRIPT
    ========================================== -->

    <script>

        function togglePasswordVisibility() {

            const passwordInput =
                document.getElementById('password');

            const toggleIcon =
                document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {

                passwordInput.type = 'text';

                toggleIcon.textContent = '🙈';

            } else {

                passwordInput.type = 'password';

                toggleIcon.textContent = '👁️';

            }

        }

    </script>


</body>

</html>
