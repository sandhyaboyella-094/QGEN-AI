<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Login | AI Question Paper Generator</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            font-family:
                'Plus Jakarta Sans',
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(130, 25, 58, 0.42),
                    transparent 40%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(130, 25, 58, 0.32),
                    transparent 40%
                ),

                linear-gradient(
                    160deg,
                    #1a0a10 0%,
                    #12060c 50%,
                    #0d0408 100%
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

            overflow-x: hidden;

            overflow-y: auto;

            position: relative;
        }


        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 650px;
            height: 650px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(156, 34, 72, 0.16),
                    transparent 65%
                );

            top: -280px;
            left: -220px;

            filter: blur(20px);

            animation:
                backgroundGlow
                12s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: 0;
        }


        body::after {

            content: "";

            position: fixed;

            width: 550px;
            height: 550px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(130, 25, 58, 0.17),
                    transparent 65%
                );

            right: -200px;
            bottom: -200px;

            filter: blur(25px);

            animation:
                backgroundGlow2
                15s
                ease-in-out
                infinite;

            pointer-events: none;

            z-index: 0;
        }


        @keyframes backgroundGlow {

            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(120px, 80px)
                    scale(1.25);
            }
        }


        @keyframes backgroundGlow2 {

            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(-100px, -80px)
                    scale(1.2);
            }
        }


        /* =====================================================
           FLOATING ORBS
        ===================================================== */

        .orb {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: 1;

            opacity: 0.28;

            animation:
                floatOrb
                11s
                ease-in-out
                infinite;
        }


        .orb1 {

            width: 300px;
            height: 300px;

            top: 20px;
            left: -60px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #82193A,
                    #3d0c1b
                );

            box-shadow:
                0 0 80px
                rgba(130, 25, 58, 0.25);
        }


        .orb2 {

            width: 220px;
            height: 220px;

            top: 48%;
            right: -50px;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #9c2248,
                    #5c1229
                );

            animation-delay: 3s;

            box-shadow:
                0 0 70px
                rgba(156, 34, 72, 0.25);
        }


        .orb3 {

            width: 160px;
            height: 160px;

            bottom: 6%;
            left: 6%;

            background:
                radial-gradient(
                    circle at 30% 30%,
                    #82193A,
                    #2a0814
                );

            animation-delay: 5.5s;
        }


        @keyframes floatOrb {

            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            33% {
                transform:
                    translate(18px, -30px)
                    scale(1.05);
            }

            66% {
                transform:
                    translate(-20px, -12px)
                    scale(0.96);
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particle {

            position: fixed;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #FEE3C5;

            opacity: 0;

            pointer-events: none;

            z-index: 2;

            box-shadow:
                0 0 8px
                rgba(254, 227, 197, 0.8),

                0 0 15px
                rgba(156, 34, 72, 0.5);

            animation:
                particleFloat
                var(--duration)
                linear
                infinite;

            animation-delay:
                var(--delay);
        }


        @keyframes particleFloat {

            0% {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.5);
            }

            15% {
                opacity: 0.8;
            }

            50% {

                opacity: 1;

                transform:
                    translateY(-120px)
                    translateX(25px)
                    scale(1);
            }

            85% {
                opacity: 0.4;
            }

            100% {

                opacity: 0;

                transform:
                    translateY(-260px)
                    translateX(-20px)
                    scale(0.2);
            }
        }


        /* =====================================================
           STARS
        ===================================================== */

        .star {

            position: fixed;

            color: #FEE3C5;

            font-size: 11px;

            opacity: 0;

            z-index: 2;

            pointer-events: none;

            text-shadow:
                0 0 8px
                rgba(254, 227, 197, 0.8);

            animation:
                starTwinkle
                var(--duration)
                ease-in-out
                infinite;

            animation-delay:
                var(--delay);
        }


        @keyframes starTwinkle {

            0%,
            100% {

                opacity: 0;

                transform:
                    scale(0)
                    rotate(0deg);
            }

            50% {

                opacity: 0.9;

                transform:
                    scale(1)
                    rotate(180deg);
            }
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-box {

            width: 420px;

            max-width: 100%;

            background:
                linear-gradient(
                    160deg,
                    #FFF8F0 0%,
                    #FEE3C5 100%
                );

            padding:
                30px 36px 34px;

            border-radius:
                22px;

            box-shadow:
                0 30px 70px
                rgba(0, 0, 0, 0.5),

                0 15px 35px
                rgba(130, 25, 58, 0.2);

            border:
                1px solid
                rgba(254, 227, 197, 0.6);

            position:
                relative;

            z-index:
                10;

            overflow:
                hidden;

            animation:
                cardEntrance
                1.1s
                cubic-bezier(
                    0.16,
                    1,
                    0.3,
                    1
                )
                forwards;
        }


        .login-box::after {

            content: "";

            position: absolute;

            inset: -2px;

            border-radius: 22px;

            border:
                1px solid
                rgba(156, 34, 72, 0.3);

            box-shadow:
                0 0 0
                rgba(156, 34, 72, 0);

            animation:
                cardGlow
                4s
                ease-in-out
                infinite;

            pointer-events:
                none;
        }


        @keyframes cardGlow {

            0%,
            100% {
                box-shadow:
                    0 0 0
                    rgba(156, 34, 72, 0);
            }

            50% {
                box-shadow:
                    0 0 35px
                    rgba(156, 34, 72, 0.25);
            }
        }


        @keyframes cardEntrance {

            0% {

                opacity: 0;

                transform:
                    translateY(70px)
                    scale(0.88);

                filter:
                    blur(8px);
            }

            60% {

                opacity: 1;

                transform:
                    translateY(-8px)
                    scale(1.02);

                filter:
                    blur(0);
            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* =====================================================
           NEW PROJECT IMAGE
           AI + QUESTION PAPER + CHECKMARK
        ===================================================== */

        .project-image {

            width: 92px;

            height: 82px;

            margin:
                0 auto 12px;

            position:
                relative;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            animation:
                projectImageFloat
                4s
                ease-in-out
                infinite;

            z-index: 3;
        }


        @keyframes projectImageFloat {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-5px);
            }
        }


        /* Document */

        .document {

            width: 58px;

            height: 70px;

            background:
                #ffffff;

            border:
                2px solid
                #82193A;

            border-radius:
                9px;

            position:
                absolute;

            right: 6px;

            top: 6px;

            box-shadow:
                0 10px 22px
                rgba(130, 25, 58, 0.2);

            transform:
                rotate(5deg);
        }


        /* Document folded corner */

        .document::before {

            content:
                "";

            position:
                absolute;

            right: -2px;

            top: -2px;

            width: 18px;

            height: 18px;

            background:
                #FEE3C5;

            border-left:
                2px solid
                #82193A;

            border-bottom:
                2px solid
                #82193A;

            border-radius:
                0 7px 0 7px;
        }


        /* Document title */

        .document-title {

            width: 31px;

            height: 5px;

            border-radius:
                4px;

            background:
                #82193A;

            margin:
                17px auto 7px;
        }


        .document-line {

            width: 36px;

            height: 4px;

            border-radius:
                4px;

            background:
                #d9b7a6;

            margin:
                5px auto;
        }


        .document-line.short {

            width:
                25px;
        }


        /* AI circle */

        .ai-circle {

            width:
                47px;

            height:
                47px;

            border-radius:
                50%;

            position:
                absolute;

            left:
                0;

            top:
                19px;

            background:
                linear-gradient(
                    135deg,
                    #82193A,
                    #9c2248
                );

            border:
                4px solid
                #FEE3C5;

            box-shadow:
                0 8px 20px
                rgba(130, 25, 58, 0.35);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            color:
                #FEE3C5;

            font-size:
                13px;

            font-weight:
                700;

            letter-spacing:
                0.5px;
        }


        /* AI sparkle */

        .ai-sparkle {

            position:
                absolute;

            color:
                #82193A;

            font-size:
                17px;

            top:
                1px;

            left:
                13px;

            animation:
                sparkle
                2.5s
                ease-in-out
                infinite;
        }


        @keyframes sparkle {

            0%,
            100% {
                opacity:
                    0.5;

                transform:
                    scale(0.8)
                    rotate(0deg);
            }

            50% {
                opacity:
                    1;

                transform:
                    scale(1.15)
                    rotate(15deg);
            }
        }


        /* Check badge */

        .check-badge {

            position:
                absolute;

            width:
                23px;

            height:
                23px;

            border-radius:
                50%;

            right:
                -1px;

            bottom:
                0;

            background:
                #82193A;

            border:
                3px solid
                #FEE3C5;

            color:
                #FEE3C5;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            font-size:
                11px;

            font-weight:
                700;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .logo {

            text-align:
                center;

            font-size:
                20px;

            font-weight:
                700;

            color:
                #82193A;

            margin-bottom:
                4px;

            font-family:
                'Playfair Display',
                serif;
        }


        h2 {

            text-align:
                center;

            color:
                #82193A;

            font-size:
                15px;

            font-weight:
                600;

            margin-bottom:
                22px;

            letter-spacing:
                0.5px;
        }


        h2::before,
        h2::after {

            content:
                "—";

            color:
                #c9a08a;

            margin:
                0 8px;
        }


        /* =====================================================
           FLASH MESSAGE
        ===================================================== */

        .message {

            background:
                #fde8e8;

            color:
                #9c2248;

            border:
                1px solid
                #f5c2c7;

            padding:
                10px;

            border-radius:
                8px;

            text-align:
                center;

            margin-bottom:
                16px;

            font-size:
                13.5px;
        }


        /* =====================================================
           ADMIN LOGIN FIELDS
        ===================================================== */

        .field {

            margin-bottom:
                17px;

            position:
                relative;
        }


        .field label {

            display:
                block;

            margin-bottom:
                7px;

            font-size:
                13.5px;

            font-weight:
                700;

            color:
                #6b3a3a;
        }


        .input-container {

            position:
                relative;
        }


        .input-icon {

            position:
                absolute;

            left:
                14px;

            top:
                50%;

            transform:
                translateY(-50%);

            font-size:
                18px;

            color:
                #82193A;

            opacity:
                0.7;

            pointer-events:
                none;
        }


        .field input {

            width:
                100%;

            padding:
                13px 14px 13px 44px;

            border:
                1.5px solid
                rgba(130, 25, 58, 0.18);

            border-radius:
                10px;

            font-size:
                14px;

            background:
                #fffdf9;

            color:
                #3d0c1b;

            transition:
                all 0.3s ease;
        }


        .field input:hover {

            border-color:
                rgba(130, 25, 58, 0.35);
        }


        .field input:focus {

            outline:
                none;

            border-color:
                #82193A;

            box-shadow:
                0 0 0 3px
                rgba(130, 25, 58, 0.12);

            background:
                #ffffff;
        }


        .field input::placeholder {

            color:
                #b08989;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width:
                100%;

            margin-top:
                5px;

            padding:
                14px;

            border:
                none;

            border-radius:
                11px;

            background:
                linear-gradient(
                    135deg,
                    #82193A,
                    #9c2248
                );

            color:
                #FEE3C5;

            font-size:
                15.5px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.3s ease;

            box-shadow:
                0 8px 20px
                rgba(130, 25, 58, 0.3);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                8px;
        }


        .login-btn:hover {

            transform:
                translateY(-4px);

            box-shadow:
                0 14px 30px
                rgba(130, 25, 58, 0.45);
        }


        .login-btn:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {

            text-align:
                center;

            margin-top:
                20px;

            font-size:
                13.5px;

            line-height:
                2;
        }


        .links a {

            color:
                #82193A;

            text-decoration:
                none;

            font-weight:
                700;

            transition:
                0.25s ease;
        }


        .links a:hover {

            text-decoration:
                underline;
        }


        .divider {

            color:
                #c9a08a;

            margin:
                5px 0;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {

                padding:
                    20px;

                align-items:
                    flex-start;
            }


            .login-box {

                width:
                    100%;

                margin:
                    20px 0;

                padding:
                    26px 24px 30px;
            }


            .project-image {

                transform:
                    scale(0.9);
            }
        }


        /* =====================================================
           REDUCE MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="orb orb1"></div>

    <div class="orb orb2"></div>

    <div class="orb orb3"></div>


    <!-- PARTICLES -->

    <div
        class="particle"
        style="
            left:8%;
            bottom:5%;
            --duration:7s;
            --delay:0s;
        ">
    </div>


    <div
        class="particle"
        style="
            left:25%;
            bottom:15%;
            --duration:9s;
            --delay:2s;
        ">
    </div>


    <div
        class="particle"
        style="
            left:48%;
            bottom:8%;
            --duration:8s;
            --delay:1s;
        ">
    </div>


    <div
        class="particle"
        style="
            left:72%;
            bottom:10%;
            --duration:10s;
            --delay:3s;
        ">
    </div>


    <div
        class="particle"
        style="
            left:90%;
            bottom:12%;
            --duration:8s;
            --delay:3.5s;
        ">
    </div>


    <!-- STARS -->

    <div
        class="star"
        style="
            left:12%;
            top:25%;
            --duration:3s;
            --delay:0s;
        ">
        ✦
    </div>


    <div
        class="star"
        style="
            left:25%;
            top:12%;
            --duration:4s;
            --delay:1s;
        ">
        ✧
    </div>


    <div
        class="star"
        style="
            left:82%;
            top:20%;
            --duration:3.5s;
            --delay:2s;
        ">
        ✦
    </div>


    <div
        class="star"
        style="
            left:91%;
            top:55%;
            --duration:4.5s;
            --delay:1.5s;
        ">
        ✧
    </div>


    <!-- =====================================================
         ADMIN LOGIN CARD
    ===================================================== -->

    <div class="login-box">


        <!-- =================================================
             NEW PROJECT IMAGE
        ================================================= -->

        <div class="project-image">

            <!-- AI Sparkle -->

            <div class="ai-sparkle">
                ✦
            </div>


            <!-- AI Circle -->

            <div class="ai-circle">
                AI
            </div>


            <!-- Question Paper -->

            <div class="document">

                <div class="document-title"></div>

                <div class="document-line"></div>

                <div class="document-line short"></div>

                <div class="document-line"></div>

                <div class="document-line short"></div>

            </div>


            <!-- Completed Badge -->

            <div class="check-badge">
                ✓
            </div>

        </div>


        <!-- PROJECT TITLE -->

        <div class="logo">

            AI Question Paper Generator

        </div>


        <!-- ADMIN LOGIN HEADING -->

        <h2>

            Admin Login

        </h2>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- =================================================
             ADMIN LOGIN FORM
        ================================================= -->

        <form method="POST">


            <!-- EMAIL FIELD -->

            <div class="field">

                <label for="email">

                    Email

                </label>

                <div class="input-container">

                    <span class="input-icon">

                        ✉

                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter admin email"
                        autocomplete="email"
                        required>

                </div>

            </div>


            <!-- PASSWORD FIELD -->

            <div class="field">

                <label for="password">

                    Password

                </label>

                <div class="input-container">

                    <span class="input-icon">

                        🔒

                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn">

                <span>
                    Login as Admin
                </span>

                <span>
                    →
                </span>

            </button>


        </form>


        <!-- =================================================
             LINKS
        ================================================= -->

        <div class="links">

            <a
                href="{{ url_for('forgot_password') }}">

                Forgot Password?

            </a>


            <div class="divider">

                or

            </div>


            <a
                href="{{ url_for('index') }}">

                🏠 Back to Home

            </a>

        </div>


    </div>


</body>

</html>
