<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Question Paper | QGEN-AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --maroon: #82193A;
            --dark-maroon: #5c1229;
            --cream: #FEE3C5;
            --gold: #e7ad55;
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(130,25,58,.32), transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(156,34,72,.22), transparent 40%),
                linear-gradient(160deg, #1a0a10, #12060c 50%, #0d0408);
            color: var(--cream);
            overflow-x: hidden;
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(2px);
            opacity: .2;
            animation: floatOrb 13s ease-in-out infinite;
        }
        .orb1 {
            width: 260px; height: 260px;
            top: 70px; left: -50px;
            background: radial-gradient(circle at 30% 30%, #82193A, #4a0f22);
        }
        .orb2 {
            width: 200px; height: 200px;
            right: -40px; top: 50%;
            background: radial-gradient(circle at 30% 30%, #9c2248, #5c1229);
            animation-delay: 2s;
        }
        @keyframes floatOrb {
            0%,100% { transform: translate(0,0); }
            33% { transform: translate(16px,-28px); }
            66% { transform: translate(-16px,-12px); }
        }

        /* Navbar */
        nav {
            height: 78px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(20,8,12,.82);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(254,227,197,.12);
            box-shadow: 0 4px 25px rgba(0,0,0,.35);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: transform .3s ease;
        }
        .nav-logo:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .nav-logo img {
            width: 190px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(231,173,85,.18));
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .nav-links a {
            color: var(--cream);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            position: relative;
            transition: .3s ease;
        }
        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0; bottom: -6px;
            width: 0; height: 2px;
            background: var(--cream);
            transition: .3s ease;
        }
        .nav-links a:hover {
            color: white;
            transform: translateY(-2px);
        }
        .nav-links a:hover::after {
            width: 100%;
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 5;
            padding: 50px 20px 80px;
            display: flex;
            justify-content: center;
        }

        /* 3D Card */
        .box {
            width: 720px;
            max-width: 95%;
            background: linear-gradient(145deg, #FEE3C5, #fce9d2);
            border-radius: 28px;
            padding: 45px 42px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.55);
            box-shadow:
                0 30px 80px rgba(0,0,0,.4),
                0 12px 35px rgba(130,25,58,.22);
            animation: cardIn .85s ease both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Shine */
        .box::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 45%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
            transform: skewX(-20deg);
            animation: shine 5.5s 1.2s infinite;
        }
        @keyframes shine {
            0%   { left: -100%; }
            20%  { left: 130%; }
            100% { left: 130%; }
        }

        .box h1 {
            font-family: 'Playfair Display', serif;
            font-size: 30px;
            color: var(--maroon);
            text-align: center;
            margin-bottom: 28px;
            position: relative;
            z-index: 2;
        }

        /* Flash Messages
           Flask's flash() with no category uses "message", so it is
           styled the same as an error here. */
        .flash {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .flash.success {
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .flash.error,
        .flash.message {
            background: rgba(220, 38, 38, 0.12);
            color: #b91c1c;
            border: 1px solid rgba(220, 38, 38, 0.25);
        }

        form {
            position: relative;
            z-index: 2;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            font-weight: 700;
            color: var(--dark-maroon);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            margin-top: 7px;
            border: 1.5px solid rgba(130,25,58,.18);
            border-radius: 12px;
            background: rgba(255,255,255,.7);
            font-size: 14px;
            color: #3d1f1f;
            outline: none;
            transition: .3s ease;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--maroon);
            background: white;
            box-shadow: 0 0 0 4px rgba(130,25,58,.12);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #82193A, #9c2248);
            color: var(--cream);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(130,25,58,.4);
            transition: .3s ease;
        }
        button[type="submit"]:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 36px rgba(130,25,58,.5);
        }

        .back {
            text-align: center;
            margin-top: 24px;
            position: relative;
            z-index: 2;
        }
        .back a {
            color: var(--maroon);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            transition: .3s ease;
        }
        .back a:hover {
            color: var(--dark-maroon);
            letter-spacing: .3px;
        }

        @media (max-width: 650px) {
            .nav-logo img { width: 150px; height: 48px; }
            .nav-links { gap: 16px; }
            .box { padding: 35px 22px; }
            .box h1 { font-size: 24px; }
            .row { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <!-- Floating Orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>

    <!-- Navbar -->
    <nav>
        <a href="{{ url_for('faculty_dashboard') }}" class="nav-logo">
            <img src="{{ url_for('static', filename='images/qgen-logo.png') }}" alt="QGEN-AI">
        </a>

        <div class="nav-links">
            <a href="{{ url_for('faculty_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('syllabus_view') }}">Syllabus</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="box">

            <h1>Generate Question Paper</h1>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="row">
                    <div>
                        <label>Subject</label>
                        <input type="text" name="subject" placeholder="Enter subject" required>
                    </div>
                    <div>
                        <label>Course / Class</label>
                        <input type="text" name="course" placeholder="Example: BCA" required>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label>Total Marks</label>
                        <select name="total_marks" required>
                            <option value="">Select Marks</option>
                            <option value="50">50 Marks</option>
                            <option value="60">60 Marks</option>
                            <option value="70">70 Marks</option>
                            <option value="80">80 Marks</option>
                            <option value="100">100 Marks</option>
                        </select>
                    </div>
                    <div>
                        <label>Difficulty Level</label>
                        <select name="difficulty" required>
                            <option value="">Select Level</option>
                            <option value="Easy">Easy</option>
                            <option value="Medium">Medium</option>
                            <option value="Hard">Hard</option>
                            <option value="Mixed">Mixed</option>
                        </select>
                    </div>
                </div>

                                <label>Number of Questions <span class="auto-tag">(automatic)</span></label>
                <input type="text" name="num_questions" id="num_questions" value="" readonly tabindex="-1" aria-readonly="true">
                <div class="auto-hint" id="count_hint"></div>

                <label>Generation Mode</label>
                <select name="generation_mode" required>
                    <option value="template">Without AI (Template Based)</option>
                    <option value="ai">With AI</option>
                </select>

                <label>Question Pattern</label>
                <select name="pattern" required>
                    <option value="">Select Pattern</option>
                    <option value="MCQ">Multiple Choice Questions</option>
                    <option value="Short">Short Answer Questions</option>
                    <option value="Medium">Medium Answer Questions</option>
                    <option value="Long">Long Answer Questions</option>
                    <option value="Mixed">Mixed Pattern</option>
                </select>

                <label>Syllabus / Topics</label>
                <textarea name="syllabus"
                          placeholder="Enter syllabus topics or select an uploaded syllabus..."></textarea>

                <button type="submit">
                    Generate Question Paper
                </button>

            </form>

            <div class="back">
                <a href="{{ url_for('faculty_dashboard') }}">
                    ← Back to Dashboard
                </a>
            </div>

        </div>
    </div>

    <style>
        .auto-tag {
            font-weight: 600;
            color: var(--maroon);
        }
        #num_questions {
            background: rgba(130,25,58,.06);
            cursor: not-allowed;
        }
        .auto-hint {
            min-height: 0;
            margin-top: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--dark-maroon);
        }
        .auto-hint.error {
            color: #b91c1c;
        }
    </style>

    <script>
        // Number of questions is worked out on the server from Total Marks
        // and Question Pattern; this only shows it to the faculty.
        (function () {
            var marks = document.querySelector('[name="total_marks"]');
            var pattern = document.querySelector('[name="pattern"]');
            var count = document.getElementById('num_questions');
            var hint = document.getElementById('count_hint');

            if (!marks || !pattern || !count || !hint) { return; }

            function update() {
                if (!marks.value || !pattern.value) {
                    count.value = '';
                    hint.className = 'auto-hint';
                    hint.textContent = '';
                    return;
                }

                fetch('/faculty/question-count?total_marks=' + encodeURIComponent(marks.value) +
                      '&pattern=' + encodeURIComponent(pattern.value), { credentials: 'same-origin' })
                    .then(function (response) { return response.json(); })
                    .then(function (data) {
                        if (data.ok) {
                            count.value = data.count;
                            hint.className = 'auto-hint';
                            hint.textContent = data.description;
                        } else {
                            count.value = '';
                            hint.className = 'auto-hint error';
                            hint.textContent = data.error || 'Could not work out the number of questions.';
                        }
                    })
                    .catch(function () {
                        count.value = '';
                        hint.className = 'auto-hint';
                        hint.textContent = '';
                    });
            }

            marks.addEventListener('change', update);
            pattern.addEventListener('change', update);
            update();
        })();
    </script>

</body>
</html>
